[package]
name = "project-studio"
version = "0.1.0"
description = "Project Studio local para administrar proyectos del portafolio."
authors = ["Jonathan Acevedo"]
edition = "2021"

[lib]
name = "project_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25", default-features = true }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
walkdir = "2"
