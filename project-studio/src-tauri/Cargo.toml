[package]
name = "project-studio"
version = "0.1.0"
description = "Gestor local del portafolio"
authors = ["Jonathan Acevedo"]
edition = "2021"

[lib]
name = "project_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
